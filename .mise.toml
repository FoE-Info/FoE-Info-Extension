[tools]
# Pinned to the verified dev toolchain. engines.node requires >=24; the
# @types/node devDependency tracks the 26.x line. Refresh with `mise lock`.
node = "26.8.2"

[env]
NODE_ENV = "development"

[env._]
path = [ "./node_modules/.bin", "./scripts" ]
file = [ ".env", ".env.local" ]

[tasks.setup]
description = "Install npm dependencies"
run = "npm run setup"

[tasks.setup-full]
description = "Install npm dependencies and synchronize uv Graphify environment"
run = "npm run setup:full"
[tasks.check]
description = "Check project code formatting with Prettier"
run = "npm run check"

[tasks.format]
description = "Format project code with Prettier"
run = "npm run format"

[tasks.dev]
description = "Start Webpack development build watcher"
run = "npm run dev"

[tasks.build]
description = "Build development extension bundle"
run = "npm run build:dev"

[tasks.build-prod]
description = "Build optimized production extension bundle"
run = "npm run build"

[tasks.clean]
description = "Remove build output"
run = "npm run clean"

[tasks.test]
description = "Run unit tests (node:test)"
run = "npm test"

[tasks.verify]
description = "Run the base verification gate (check + lint + typecheck + i18n + test + build)"
run = "npm run verify"

[tasks.verify-full]
description = "Run base verification gate plus Graphify AST refresh"
run = "npm run verify && mise run graph-ast"
[tasks.lint]
description = "Lint source with ESLint"
run = "npm run lint"

[tasks.typecheck]
description = "Type-check sources with tsc"
run = "npm run typecheck"

[tasks.i18n-check]
description = "Check i18n key parity across locales"
run = "npm run i18n:check"

[tasks.metadata-download]
description = "Ingest offline metadata datasets"
run = "npm run metadata:download"

[tasks.metadata-query]
description = "Query the offline metadata store"
run = "npm run metadata:query"

[tasks.graph-ast]
description = "Update FoE-Info Graphify AST"
run = "bash .agents/scripts/graphify.sh foe-info ast"

[tasks.graph-update]
description = "Incremental update of FoE-Info Graphify knowledge graph"
run = "bash .agents/scripts/graphify.sh foe-info update"

[tasks.graph-reindex]
description = "Full semantic reindex of FoE-Info knowledge graph"
run = "bash .agents/scripts/graphify.sh foe-info reindex"
