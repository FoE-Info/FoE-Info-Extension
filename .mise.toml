[tools]
node = "22"
python = "3.12"
uv = "0.12.3"
"npm:prettier" = "3.9.6"
"npm:npm-check-updates" = "23.0.1"

[env]
_.file = [".env", ".env.local"]
_.path = ["./node_modules/.bin"]

[tasks.check]
description = "Check project code formatting with Prettier"
run = "prettier --check ."

[tasks.format]
description = "Format project code with Prettier"
run = "prettier --write ."

[tasks.dev]
description = "Start Webpack development build watcher"
env = { NODE_ENV = "development" }
run = "webpack --config webpack.dev.js --watch"

[tasks.build]
description = "Build optimized production extension bundle"
env = { NODE_ENV = "production" }
run = "webpack --config webpack.prod.js"

[tasks."build:dev"]
description = "Build single development extension bundle"
env = { NODE_ENV = "development" }
run = "webpack --config webpack.dev.js"

[tasks.analyze]
description = "Analyze production bundle composition"
env = { NODE_ENV = "production", ANALYZE = "true" }
run = "webpack --config webpack.prod.js"

[tasks.setup]
description = "Setup complete project environment (mise tools & node_modules)"
run = [
  "mise install",
  "npm install"
]

[tasks.graphify-update]
description = "Update the graph and scope exploration sections to src/"
env = { UV_CACHE_DIR = "{{config_root}}/.cache/uv", UV_TOOL_DIR = "{{config_root}}/.cache/uv/tools" }
run = "(command -v uvx >/dev/null 2>&1 && uvx --from \"graphifyy[gemini,mcp]==0.9.36\" graphify update . || (command -v pipx >/dev/null 2>&1 && pipx run --spec \"graphifyy[gemini,mcp]==0.9.36\" graphify update . || graphify update .)) && npm run graphify-filter-surprises"

[tasks.outdated]
description = "Check for package updates with npm-check-updates"
run = "npx --yes npm-check-updates@23.0.1"

[tasks."test:config"]
description = "Test repository configuration synchronization"
run = "node scripts/repository-config.test.mjs"

[tasks."test:graphify-report"]
description = "Test Graphify report surprise filtering"
run = "node scripts/graphify-filter-surprises.test.mjs"

[tasks.graphify-filter-surprises]
description = "Scope Graphify surprises and questions to src/"
run = "node scripts/graphify-filter-surprises.mjs"
