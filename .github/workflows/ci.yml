name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
      CI_TEST_EVIDENCE_DIR: build/ci-evidence
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.8.2
          cache: npm

      - name: Set up font-subsetting tools
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.13
          python-version: 3.14.7

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$CI_TEST_EVIDENCE_DIR"
          npm ci 2>&1 | tee "$CI_TEST_EVIDENCE_DIR/install-console.log"
        id: install

      - name: Run verification gate
        run: npm run verify:evidence
        id: verify

      - name: Upload verification evidence
        if: always() && (steps.install.outcome != 'skipped' || steps.verify.outcome != 'skipped')
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: build/ci-evidence/
          if-no-files-found: warn
          retention-days: 14
